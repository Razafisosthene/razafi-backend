<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAZAFI — Exceptions de facturation</title>
  <link rel="stylesheet" href="/admin/admin.css?v=s13-10-1-1">
  <style>
    .be-shell{width:min(1120px,96%);display:grid;gap:15px}
    .be-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .be-banner{padding:14px 16px;border-radius:18px;background:#eef8ff;color:#1849a9;font-weight:800;line-height:1.45}
    .be-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .be-stat{appearance:none;width:100%;padding:14px;border-radius:18px;background:#fff;border:1px solid #e4e7ec;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}
    .be-stat strong{display:block;font-size:22px;margin-top:4px}
    .be-stat:hover{border-color:#b9c7da}
    .be-stat:focus-visible{outline:3px solid rgba(22,119,255,.22);outline-offset:2px}
    .be-stat[aria-pressed="true"]{border-color:#1677ff;background:#eef6ff}
    .be-stat[aria-pressed="true"] .be-muted{color:#2457a6}
    .be-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px;border:1px solid #e4e7ec;border-radius:18px;background:#fff}
    .be-field{display:grid;gap:7px;min-width:0}
    .be-field>span{font-size:13px;font-weight:850;color:#344054}
    .be-select{appearance:auto;width:100%;min-height:48px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;color:#101828;padding:0 13px;font:inherit;font-size:16px}
    .be-select:focus-visible{outline:3px solid rgba(22,119,255,.18);outline-offset:1px;border-color:#1677ff}
    .be-filter-context{grid-column:1/-1;margin-top:1px}
    .be-section{display:grid;gap:10px}
    .be-section h2{margin:4px 0 0;font-size:19px}
    .be-list{display:grid;gap:10px}
    .be-card{padding:15px;border-radius:18px;background:#fff;border:1px solid #e4e7ec;box-shadow:0 8px 22px rgba(15,23,42,.05)}
    .be-card.dead{border-left:4px solid #dc2626}
    .be-card.warn{border-left:4px solid #f59e0b}
    .be-card.ok{border-left:4px solid #16a34a}
    .be-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .be-muted{color:#667085;font-size:13px;line-height:1.45}
    .be-pills{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
    .be-pill{padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:850}
    .be-pill.dead{background:#fee4e2;color:#b42318}
    .be-pill.warn{background:#fff1c2;color:#7a4d00}
    .be-pill.ok{background:#dcfce7;color:#166534}
    .be-error{display:none;padding:12px;border-radius:14px;background:#fee4e2;color:#b42318}
    .be-empty{padding:20px;border-radius:18px;background:#ecfdf3;color:#166534;font-weight:750}
    .be-btn{border:0;border-radius:12px;padding:10px 13px;background:#1677ff;color:#fff;font-weight:850;cursor:pointer}
    .be-btn:disabled{opacity:.55;cursor:not-allowed}
    .be-error-text{margin-top:8px;padding:9px 10px;border-radius:12px;background:#fff5f4;color:#b42318;font-size:12px;word-break:break-word}
    .be-owner-fix{margin-top:9px;padding:10px 12px;border-radius:12px;background:#fff8e7;color:#7a4d00;font-size:13px;font-weight:750;line-height:1.45}
    .be-ref{word-break:break-word}
    .be-pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:2px}
    .be-pagination[hidden]{display:none}
    .be-page-actions{display:flex;gap:8px;flex-wrap:wrap}
    .be-page-btn{min-height:44px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;color:#101828;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer}
    .be-page-btn:disabled{opacity:.45;cursor:not-allowed}
    .be-page-btn:focus-visible{outline:3px solid rgba(22,119,255,.18);outline-offset:1px}
    @media(max-width:760px){
      .be-summary{grid-template-columns:repeat(2,1fr)}
      .be-filters{grid-template-columns:1fr}
      .be-filter-context{grid-column:auto}
    }
    @media(max-width:480px){
      .be-summary{grid-template-columns:1fr 1fr}
      .be-stat strong{font-size:19px}
      .be-row>.be-btn{width:100%}
      .be-pagination{align-items:stretch}
      .be-page-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
      .be-page-btn{width:100%}
    }
  </style>
</head>
<body class="rz-admin-shell">
  <div class="login-container">
    <main class="card be-shell">
      <div class="topbar be-head">
        <div>
          <h1 class="rz-hero-title">Exceptions de facturation</h1>
          <div id="me" class="subtitle">Vérification de la session…</div>
        </div>
        <button id="refreshBtn" class="filter-btn" type="button">Actualiser</button>
      </div>

      <div class="be-banner">
        Les notifications sont traitées automatiquement. Les éléments nécessitant une intervention Superadmin apparaissent dans « À traiter ».
      </div>

      <div id="error" class="be-error"></div>
      <section id="summary" class="be-summary" aria-label="Vues des notifications"></section>

      <section class="be-filters" aria-label="Filtres des notifications">
        <label class="be-field">
          <span>Pool</span>
          <select id="poolFilter" class="be-select">
            <option value="">Tous les pools</option>
          </select>
        </label>

        <label class="be-field">
          <span>Type de notification</span>
          <select id="eventTypeFilter" class="be-select">
            <option value="">Tous les types</option>
          </select>
        </label>

        <div id="filterContext" class="be-muted be-filter-context">
          Les compteurs et la liste suivent les filtres sélectionnés.
        </div>
      </section>

      <section class="be-section" aria-live="polite">
        <h2 id="resultsTitle">À traiter</h2>
        <div id="results" class="be-list"><div class="be-muted">Chargement…</div></div>
        <nav id="pagination" class="be-pagination" aria-label="Pagination des notifications" hidden>
          <div id="pageInfo" class="be-muted"></div>
          <div class="be-page-actions">
            <button id="prevBtn" class="be-page-btn" type="button">Précédent</button>
            <button id="nextBtn" class="be-page-btn" type="button">Suivant</button>
          </div>
        </nav>
      </section>
    </main>
  </div>

  <script src="/admin/nav.js?v=s13-10-1-1"></script>
  <script src="/admin/billing-exceptions.js?v=s13-10-1-2c"></script>
</body>
</html>
