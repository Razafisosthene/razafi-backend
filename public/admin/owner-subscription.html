<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAZAFI — Mon abonnement</title>
  <link rel="stylesheet" href="/admin/admin.css?v=billing-s13-8-1-2">
  <style>
    .sub-shell{width:min(1100px,96%);display:grid;gap:16px}
    .sub-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .sub-card,.sub-banner{padding:16px;border-radius:20px;background:rgba(255,255,255,.9);border:1px solid rgba(17,24,39,.09);box-shadow:0 10px 25px rgba(15,23,42,.07)}
    .sub-banner{background:#eef8ff;color:#1849a9;font-weight:800}
    .sub-card h3{margin:0 0 6px}.sub-muted{color:#667085;font-size:13px}
    .sub-pills{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
    .sub-pill{padding:6px 9px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:850}
    .sub-ok{background:#dcfce7;color:#166534}.sub-wait{background:#fff1c2;color:#7a4d00}.sub-bad{background:#fee4e2;color:#b42318}
    .sub-form{display:grid;gap:10px;margin-top:12px}.sub-form input,.sub-form select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd4dc;border-radius:12px;background:#fff;font:inherit}
    .sub-actions{display:flex;gap:8px;flex-wrap:wrap}.sub-btn,.sub-link{border:0;border-radius:12px;padding:11px 14px;background:#1677ff;color:#fff;font-weight:850;cursor:pointer;text-decoration:none;text-align:center}
    .sub-btn:disabled{opacity:.55;cursor:not-allowed}.sub-pay{background:#16a34a}.sub-link{display:inline-flex;background:#eef4ff;color:#155eef}.sub-cancel{background:#fff;color:#b42318;border:1px solid #fda29b}
    .sub-status{padding:13px;border-radius:15px;background:#f3f7fb;line-height:1.5}.sub-status.wait{background:#fff7d6;color:#6b4e00}.sub-status.ok{background:#ecfdf3;color:#166534}.sub-status.bad,.sub-error{background:#fee4e2;color:#b42318}
    .sub-steps{margin:10px 0 0;padding-left:22px;line-height:1.75;font-size:13px}.sub-steps li{color:#98a2b3}.sub-steps li.done{color:#166534;font-weight:750}.sub-steps li.current{color:#1849a9;font-weight:850}
    .sub-error{display:none;padding:12px;border-radius:14px}.sub-empty{padding:17px;border-radius:16px;background:#f3f7fb;color:#667085}
    .sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.sub-pool-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
    .sub-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.sub-offer{display:grid;gap:12px;padding:15px;border:1px solid #dfe4ea;border-radius:16px;background:#fff}.sub-offer-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sub-offer label{display:grid;gap:6px;font-weight:750}.sub-offer select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd4dc;border-radius:12px;background:#fff;font:inherit}
    .sub-history-title{font-weight:850;color:#667085;margin-top:4px}.sub-money-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.sub-money{padding:12px;border-radius:14px;background:#f3f7fb}.sub-money strong{display:block;margin-top:4px;font-size:18px}.sub-provisional{border-left:4px solid #f59e0b}.sub-closed{border-left:4px solid #16a34a}

    .sub-pool-list{display:grid;gap:11px}.sub-pool-fold{border:1px solid #e4e7ec;border-radius:22px;background:rgba(255,255,255,.94);overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.05)}
    .sub-pool-fold>summary,.sub-section-fold>summary{list-style:none;cursor:pointer}.sub-pool-fold>summary::-webkit-details-marker,.sub-section-fold>summary::-webkit-details-marker{display:none}
    .sub-pool-summary{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;min-height:62px}.sub-pool-summary-main{min-width:0;display:grid;gap:5px}.sub-pool-title{font-size:17px;font-weight:900;line-height:1.25}.sub-pool-meta{font-size:13px;color:#667085;font-weight:750;line-height:1.35}.sub-pool-summary::after{content:"›";font-size:27px;line-height:1;color:#98a2b3;transition:transform .18s ease}.sub-pool-fold[open]>.sub-pool-summary::after{transform:rotate(90deg)}
    .sub-pool-body{display:grid;gap:9px;padding:0 12px 12px;border-top:1px solid #eef1f5;background:#fbfcfe}.sub-section-fold{border:1px solid #e5e9ef;border-radius:16px;background:#fff;overflow:hidden}.sub-section-fold>summary{padding:14px 15px;font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:10px}.sub-section-fold>summary::after{content:"＋";color:#667085}.sub-section-fold[open]>summary::after{content:"−"}.sub-section-content{padding:0 13px 13px;display:grid;gap:11px}.sub-section-content>.sub-card{box-shadow:none;background:#fff}.sub-section-note{font-size:12px;color:#667085;margin:-2px 0 2px}
    .sub-state-dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;background:#98a2b3}.sub-state-dot.ok{background:#16a34a}.sub-state-dot.wait{background:#f59e0b}.sub-state-dot.bad{background:#dc2626}
    @media(max-width:700px){.sub-money-grid{grid-template-columns:1fr}.sub-pool-summary{padding:15px}.sub-pool-title{font-size:16px}}
    @media(max-width:600px){.sub-actions>*{width:100%}.sub-offers,.sub-grid,.sub-pool-items{grid-template-columns:1fr}.sub-shell{width:min(100%,96%)}}
  </style>
</head>
<body class="rz-admin-shell">
  <div class="login-container">
    <main class="card sub-shell">
      <div class="topbar sub-head">
        <div>
          <h1 class="rz-hero-title">Mon abonnement RAZAFI</h1>
          <div id="me" class="subtitle">Vérification de la session…</div>
        </div>
        <button id="refreshBtn" class="filter-btn">Actualiser</button>
      </div>
      <div class="sub-banner">Sélectionnez un pool pour consulter son offre, ses factures, ses paiements et son historique.</div>
      <div id="error" class="sub-error"></div>
      <div id="poolSubscriptions" class="sub-pool-list"><div class="sub-empty">Chargement…</div></div>
    </main>
  </div>
  <script src="/admin/nav.js?v=billing-s13-9-1-2-1"></script>
  <script src="/admin/owner-subscription.js?v=billing-s13-9-4-3"></script>
</body>
</html>
