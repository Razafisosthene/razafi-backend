  <link rel="stylesheet" href="/admin/admin.css?v=billing-s13-8-1-2">
  <style>

    .sub-pills{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}

    .sub-form{display:grid;gap:10px;min-width:0;margin-top:12px}.sub-form label{display:grid;gap:6px;min-width:0;font-weight:750}.sub-form input,.sub-form select{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd4dc;border-radius:12px;background:#fff;font:inherit}

    .sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:12px;min-width:0}.sub-pool-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:10px;min-width:0}
    .sub-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.sub-offer{display:grid;gap:12px;padding:15px;border:1px solid #dfe4ea;border-radius:16px;background:#fff}.sub-offer-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sub-offer label{display:grid;gap:6px;font-weight:750}.sub-offer select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd4dc;border-radius:12px;background:#fff;font:inherit}
    .sub-offer-details{border-top:1px solid #eef1f5;padding-top:2px}.sub-offer-details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 1px 7px;color:#344054;font-size:13px;font-weight:850}.sub-offer-details>summary::-webkit-details-marker{display:none}.sub-offer-details>summary:focus{outline:none}.sub-offer-details>summary:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(22,119,255,.14);border-radius:10px}.sub-offer-details-chevron{font-size:22px;line-height:1;color:#98a2b3;transition:transform .18s ease}.sub-offer-details[open] .sub-offer-details-chevron{transform:rotate(90deg)}.sub-offer-details-list{display:grid;gap:8px;padding:2px 1px 4px}.sub-offer-detail{display:flex;align-items:flex-start;gap:9px;color:#475467;font-size:13px;line-height:1.45}.sub-offer-detail-check{flex:0 0 auto;font-weight:900;color:#1677ff}

    .sub-pool-summary{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;min-height:62px}.sub-pool-summary-main{min-width:0;display:grid;gap:5px}.sub-pool-title{font-size:17px;font-weight:900;line-height:1.25}.sub-pool-meta{font-size:13px;color:#667085;font-weight:750;line-height:1.35}.sub-pool-summary::after{content:"›";font-size:27px;line-height:1;color:#98a2b3;transition:transform .18s ease}.sub-pool-fold[open]>.sub-pool-summary::after{transform:rotate(90deg)}
    .sub-pool-body{display:grid;gap:9px;padding:0 12px 12px;border-top:1px solid #eef1f5;background:#fbfcfe;min-width:0}.sub-section-fold{border:1px solid #e5e9ef;border-radius:16px;background:#fff;overflow:hidden;min-width:0}.sub-section-fold>summary{padding:14px 15px;font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:10px}.sub-section-fold>summary::after{content:"＋";color:#667085}.sub-section-fold[open]>summary::after{content:"−"}.sub-section-content{padding:0 13px 13px;display:grid;gap:11px;min-width:0}.sub-section-content>.sub-card{box-shadow:none;background:#fff}.sub-section-note{font-size:12px;color:#667085;margin:-2px 0 2px}.sub-document-title{margin-bottom:5px}.sub-document-ref{font-size:11px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}

    .sub-invoice-current{display:grid;gap:12px;border-color:rgba(22,119,255,.14);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,251,255,.96))}

    .sub-invoice-title{margin:2px 0 0!important;font-size:21px;line-height:1.15;letter-spacing:-.025em;color:#101828}
    .sub-invoice-offer{margin-top:5px;color:#667085;font-size:13px;font-weight:750}
    .sub-invoice-amount{flex:0 0 auto;font-size:24px;line-height:1;font-weight:950;letter-spacing:-.035em;color:#101828;white-space:nowrap}

    .sub-invoice-details{border-top:1px solid #eef1f5;padding-top:2px;min-width:0}
    .sub-invoice-details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 1px 7px;color:#475467;font-size:12px;font-weight:850}
    .sub-invoice-details>summary::-webkit-details-marker{display:none}.sub-invoice-details>summary::after{content:"›";font-size:20px;line-height:1;color:#98a2b3;transition:transform .18s ease}.sub-invoice-details[open]>summary::after{transform:rotate(90deg)}
    .sub-invoice-technical{display:grid;gap:5px;padding:4px 0 2px;color:#667085;font-size:11px;line-height:1.45;min-width:0}.sub-invoice-ref{overflow-wrap:anywhere;word-break:break-word}
    .sub-invoice-history{display:grid;gap:8px;margin-top:2px}.sub-invoice-history-heading{margin:4px 1px 1px;color:#667085;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.035em}
    .sub-invoice-history-item{border:1px solid #e5e9ef;border-radius:16px;background:#fff;overflow:hidden;min-width:0}
    .sub-invoice-history-item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:13px 14px;min-width:0}
    .sub-invoice-history-item>summary::-webkit-details-marker{display:none}.sub-invoice-history-main{min-width:0}.sub-invoice-history-period{display:block;color:#101828;font-size:14px;font-weight:900;line-height:1.25}.sub-invoice-history-offer{display:block;margin-top:3px;color:#667085;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .sub-invoice-history-body{display:grid;gap:10px;padding:0 14px 14px;border-top:1px solid #eef1f5;min-width:0}.sub-invoice-history-body>.sub-invoice-technical{padding-top:11px}
    .sub-invoice-actions{margin-top:0!important}
    .sub-invoice-status-pill{justify-self:start}

    .sub-state-dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;background:#98a2b3}.sub-state-dot.ok{background:#16a34a}.sub-state-dot.wait{background:#f59e0b}.sub-state-dot.bad{background:#dc2626}
    @media(max-width:700px){.sub-money-grid{grid-template-columns:1fr}.sub-pool-summary{padding:15px}.sub-pool-title{font-size:16px}.sub-invoice-head{display:grid;gap:8px}.sub-invoice-amount{font-size:22px}.sub-invoice-history-item>summary{grid-template-columns:minmax(0,1fr) auto}.sub-invoice-history-amount{grid-column:1/2;grid-row:2/3}.sub-invoice-history-chevron{grid-column:2/3;grid-row:1/3;align-self:center}}
