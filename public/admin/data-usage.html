<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAZAFI Admin — Consommation des données</title>
  <link rel="stylesheet" href="/admin/admin.css?v=admin-wide-1" />

  <style>
    .rz-du-shell{display:flex;flex-direction:column;gap:14px;}
    .rz-du-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
    .rz-du-title-block{min-width:0;}
    .rz-du-me{white-space:normal;line-height:1.25;}
    .rz-du-me strong{display:block;color:var(--rz-text,#111827);font-weight:900;margin-top:2px;word-break:break-word;}

    .rz-du-card{
      border-radius:24px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.90);
      box-shadow:0 12px 28px rgba(15,23,42,.08);
    }

    .rz-du-toolbar{
      display:grid;
      grid-template-columns:minmax(170px,.6fr) minmax(220px,.9fr) auto;
      gap:10px;
      align-items:end;
      padding:14px;
    }
    .rz-du-field label{
      display:block;
      margin:0 0 6px;
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.045em;
    }
    .rz-du-field input,.rz-du-field select{margin:0;}
    .rz-du-refresh{width:auto!important;min-height:44px;}

    .rz-du-msg{
      display:none;
      padding:11px 13px;
      border-radius:16px;
      font-size:13px;
      font-weight:800;
      background:rgba(13,110,253,.07);
      border:1px solid rgba(13,110,253,.12);
      color:#1d4ed8;
    }
    .rz-du-msg.is-visible{display:block;}
    .rz-du-msg.is-error{
      background:rgba(239,68,68,.08);
      border-color:rgba(239,68,68,.16);
      color:#b91c1c;
    }

    .rz-du-total{
      display:none;
      padding:18px;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .rz-du-total.is-visible{display:flex;}
    .rz-du-total-label{font-size:13px;color:var(--rz-muted,#6b7280);font-weight:800;}
    .rz-du-total-value{
      margin-top:4px;
      font-size:28px;
      line-height:1;
      letter-spacing:-.04em;
      font-weight:950;
      color:var(--rz-text,#111827);
    }
    .rz-du-total-note{
      max-width:420px;
      color:var(--rz-muted,#6b7280);
      font-size:12px;
      font-weight:700;
      line-height:1.45;
      text-align:right;
    }

    .rz-du-list{display:grid;gap:14px;}

    .rz-du-pool{
      padding:18px;
      overflow:hidden;
    }
    .rz-du-pool-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .rz-du-pool-name{
      font-size:19px;
      line-height:1.2;
      letter-spacing:-.025em;
      font-weight:950;
      color:var(--rz-text,#111827);
    }
    .rz-du-pool-sub{
      margin-top:4px;
      color:var(--rz-muted,#6b7280);
      font-size:12px;
      font-weight:750;
    }
    .rz-du-status{
      display:inline-flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(22,163,74,.10);
      border:1px solid rgba(22,163,74,.16);
      color:#15803d;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }
    .rz-du-status::before{
      content:"";
      width:7px;height:7px;border-radius:999px;background:currentColor;
    }
    .rz-du-status.waiting{
      background:rgba(100,116,139,.09);
      border-color:rgba(100,116,139,.15);
      color:#64748b;
    }

    .rz-du-hero{
      padding:17px 0 15px;
      border-top:1px solid rgba(17,24,39,.06);
      border-bottom:1px solid rgba(17,24,39,.06);
    }
    .rz-du-value{
      font-size:clamp(34px,7vw,52px);
      line-height:.98;
      letter-spacing:-.055em;
      font-weight:950;
      color:var(--rz-text,#111827);
    }
    .rz-du-period{
      margin-top:7px;
      font-size:14px;
      font-weight:850;
      color:rgba(17,24,39,.70);
    }
    .rz-du-coverage{
      margin-top:9px;
      display:inline-flex;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(245,158,11,.09);
      border:1px solid rgba(245,158,11,.15);
      color:#92400e;
      font-size:11px;
      font-weight:850;
    }

    .rz-du-metrics{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:14px;
    }
    .rz-du-metric{
      min-width:0;
      padding:13px;
      border-radius:18px;
      background:rgba(248,250,252,.85);
      border:1px solid rgba(17,24,39,.06);
    }
    .rz-du-metric-label{
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.035em;
    }
    .rz-du-metric-value{
      margin-top:6px;
      color:var(--rz-text,#111827);
      font-size:17px;
      font-weight:950;
      letter-spacing:-.025em;
      overflow-wrap:anywhere;
    }
    .rz-du-metric-note{
      margin-top:4px;
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:700;
      line-height:1.35;
    }


    .rz-du-level{
      margin-top:9px;
      display:inline-flex;
      align-items:center;
      padding:7px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      background:rgba(59,130,246,.08);
      border:1px solid rgba(59,130,246,.14);
      color:#1d4ed8;
    }
    .rz-du-level.medium{
      background:rgba(245,158,11,.09);
      border-color:rgba(245,158,11,.16);
      color:#92400e;
    }
    .rz-du-level.high{
      background:rgba(239,68,68,.08);
      border-color:rgba(239,68,68,.15);
      color:#b91c1c;
    }

    .rz-du-attribution{
      margin-top:14px;
      padding:14px;
      border-radius:18px;
      background:rgba(248,250,252,.72);
      border:1px solid rgba(17,24,39,.06);
    }
    .rz-du-section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }
    .rz-du-section-title{
      color:var(--rz-text,#111827);
      font-size:13px;
      font-weight:950;
    }
    .rz-du-section-sub{
      margin-top:3px;
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:700;
      line-height:1.4;
    }
    .rz-du-quality{
      flex:0 0 auto;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(22,163,74,.09);
      border:1px solid rgba(22,163,74,.15);
      color:#15803d;
      font-size:10px;
      font-weight:900;
    }
    .rz-du-quality.waiting{
      background:rgba(100,116,139,.08);
      border-color:rgba(100,116,139,.14);
      color:#64748b;
    }
    .rz-du-attribution-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px;
      margin-top:12px;
    }
    .rz-du-attribution-item{
      min-width:0;
      padding:11px;
      border-radius:15px;
      background:rgba(255,255,255,.76);
      border:1px solid rgba(17,24,39,.05);
    }
    .rz-du-attribution-label{
      color:var(--rz-muted,#6b7280);
      font-size:10px;
      font-weight:850;
      line-height:1.3;
    }
    .rz-du-attribution-value{
      margin-top:5px;
      color:var(--rz-text,#111827);
      font-size:16px;
      font-weight:950;
      letter-spacing:-.02em;
    }
    .rz-du-attribution-pct{
      margin-top:2px;
      color:rgba(17,24,39,.55);
      font-size:10px;
      font-weight:800;
    }
    .rz-du-attribution-bar{
      display:flex;
      height:9px;
      margin-top:11px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(17,24,39,.06);
    }
    .rz-du-attribution-bar span{display:block;height:100%;}
    .rz-du-attribution-bar .auth{background:#2563eb;}
    .rz-du-attribution-bar .free{background:#16a34a;}
    .rz-du-attribution-bar .other{background:#64748b;}
    .rz-du-attribution-note,
    .rz-du-attribution-warn{
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:700;
      line-height:1.45;
    }
    .rz-du-attribution-note{margin-top:7px;}
    .rz-du-attribution-warn{
      margin-top:10px;
      padding:9px 10px;
      border-radius:13px;
      background:rgba(245,158,11,.08);
      border:1px solid rgba(245,158,11,.14);
      color:#92400e;
    }

    .rz-du-chart-wrap{
      margin:12px 0 4px;
      padding:8px 8px 2px;
      border-radius:15px;
      background:rgba(255,255,255,.68);
      border:1px solid rgba(17,24,39,.05);
    }
    .rz-du-chart{display:block;width:100%;height:auto;overflow:visible;}
    .rz-du-chart .axis{stroke:rgba(17,24,39,.12);stroke-width:1;}
    .rz-du-chart .line{
      fill:none;
      stroke:#111827;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.78;
    }
    .rz-du-chart .dot{fill:#fff;stroke:#111827;stroke-width:2;}
    .rz-du-chart .label{fill:rgba(17,24,39,.55);font-size:11px;font-weight:700;}
    .rz-du-chart-empty{
      margin:10px 0 2px;
      padding:12px;
      border-radius:13px;
      background:rgba(255,255,255,.65);
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:750;
      text-align:center;
    }

    .rz-du-threshold{margin-top:14px;}
    .rz-du-threshold-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:rgba(17,24,39,.72);
      font-size:12px;
      font-weight:850;
    }
    .rz-du-progress{
      height:8px;
      margin-top:8px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(17,24,39,.07);
    }
    .rz-du-progress > span{
      display:block;
      height:100%;
      min-width:0;
      max-width:100%;
      border-radius:inherit;
      background:currentColor;
      color:#0d6efd;
    }

    .rz-du-history{
      margin-top:14px;
      border-radius:18px;
      background:rgba(248,250,252,.72);
      border:1px solid rgba(17,24,39,.06);
      overflow:hidden;
    }
    .rz-du-history summary{
      cursor:pointer;
      list-style:none;
      padding:13px 14px;
      font-size:13px;
      font-weight:900;
      color:var(--rz-text,#111827);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .rz-du-history summary::-webkit-details-marker{display:none;}
    .rz-du-history summary::after{content:"⌄";color:var(--rz-muted,#6b7280);font-size:17px;}
    .rz-du-history[open] summary::after{content:"⌃";}
    .rz-du-history-body{
      padding:0 14px 13px;
      border-top:1px solid rgba(17,24,39,.05);
    }
    .rz-du-day{
      display:grid;
      grid-template-columns:minmax(88px,.5fr) minmax(120px,1fr) auto;
      gap:10px;
      align-items:center;
      padding:10px 0;
      border-bottom:1px solid rgba(17,24,39,.05);
    }
    .rz-du-day:last-child{border-bottom:0;}
    .rz-du-day-date{font-size:12px;font-weight:850;color:rgba(17,24,39,.76);}
    .rz-du-day-bar{
      height:7px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(17,24,39,.06);
    }
    .rz-du-day-bar > span{
      display:block;height:100%;border-radius:inherit;
      background:#111827;
      opacity:.72;
    }
    .rz-du-day-value{font-size:12px;font-weight:900;color:var(--rz-text,#111827);text-align:right;}

    .rz-du-reset{
      margin-top:12px;
      padding:10px 12px;
      border-radius:15px;
      background:rgba(245,158,11,.09);
      border:1px solid rgba(245,158,11,.15);
      color:#92400e;
      font-size:12px;
      font-weight:800;
      line-height:1.4;
    }

    .rz-du-empty{
      padding:24px 18px;
      text-align:center;
      color:var(--rz-muted,#6b7280);
      font-size:13px;
      font-weight:800;
    }

    .rz-du-footnote{
      padding:14px 16px;
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:700;
      line-height:1.5;
    }
    .rz-du-footnote strong{color:rgba(17,24,39,.78);}


    .rz-du-pool-actions{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      flex:0 0 auto;
    }
    .rz-du-yield-btn{
      appearance:none;
      border:1px solid rgba(17,24,39,.10);
      background:rgba(255,255,255,.86);
      color:var(--rz-text,#111827);
      border-radius:999px;
      min-height:34px;
      padding:7px 11px;
      font:inherit;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(15,23,42,.05);
    }
    .rz-du-yield-btn:hover{background:#fff;border-color:rgba(17,24,39,.16);}
    .rz-du-yield-btn:focus-visible{outline:3px solid rgba(13,110,253,.18);outline-offset:2px;}

    body.rz-yield-modal-open{overflow:hidden;}
    /* Yield modal owns the viewport: hide the persistent Admin shortcut bar
       while the sheet is open so it never overlaps the modal actions. */
    body.rz-yield-modal-open #rzBottomNav{
      opacity:0 !important;
      visibility:hidden !important;
      pointer-events:none !important;
    }
    .rz-yield-modal{
      position:fixed;
      inset:0;
      z-index:1400;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .rz-yield-modal.is-open{display:flex;}
    .rz-yield-backdrop{
      position:absolute;
      inset:0;
      background:rgba(15,23,42,.34);
      backdrop-filter:blur(8px);
    }
    .rz-yield-sheet{
      position:relative;
      z-index:1;
      width:min(720px,100%);
      max-height:min(88vh,860px);
      overflow:auto;
      border-radius:28px;
      background:rgba(255,255,255,.97);
      border:1px solid rgba(255,255,255,.98);
      box-shadow:0 30px 90px rgba(15,23,42,.24);
    }
    .rz-yield-sheet-head{
      position:sticky;
      top:0;
      z-index:2;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      padding:20px 20px 14px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(17,24,39,.06);
    }
    .rz-yield-eyebrow{
      color:var(--rz-muted,#6b7280);
      font-size:10px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.07em;
    }
    .rz-yield-sheet h2{
      margin:4px 0 0;
      color:var(--rz-text,#111827);
      font-size:24px;
      line-height:1.08;
      letter-spacing:-.035em;
      font-weight:950;
    }
    .rz-yield-close{
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border:0;
      border-radius:999px;
      background:rgba(17,24,39,.06);
      color:#111827;
      font-size:24px;
      line-height:1;
      cursor:pointer;
    }
    .rz-yield-content{padding:18px 20px 20px;}
    .rz-yield-loading,.rz-yield-error{
      padding:34px 16px;
      text-align:center;
      color:var(--rz-muted,#6b7280);
      font-size:13px;
      font-weight:800;
    }
    .rz-yield-error{color:#b91c1c;}
    .rz-yield-pool-name{
      color:var(--rz-text,#111827);
      font-size:20px;
      font-weight:950;
      letter-spacing:-.025em;
    }
    .rz-yield-pool-meta{
      margin-top:4px;
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:750;
    }
    .rz-yield-mode{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-top:15px;
      padding:13px 14px;
      border-radius:18px;
      background:rgba(37,99,235,.06);
      border:1px solid rgba(37,99,235,.12);
    }
    .rz-yield-mode strong{
      display:block;
      color:#1d4ed8;
      font-size:12px;
      font-weight:950;
    }
    .rz-yield-mode span:not(.rz-yield-mode-pill){
      display:block;
      margin-top:3px;
      color:rgba(30,64,175,.74);
      font-size:11px;
      font-weight:700;
      line-height:1.4;
    }
    .rz-yield-mode-pill{
      flex:0 0 auto;
      padding:5px 8px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(37,99,235,.12);
      color:#1d4ed8;
      font-size:9px;
      font-weight:950;
      letter-spacing:.05em;
    }
    .rz-yield-state-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
      margin-top:12px;
    }
    .rz-yield-state-card{
      min-width:0;
      padding:11px;
      border-radius:15px;
      background:rgba(248,250,252,.88);
      border:1px solid rgba(17,24,39,.06);
    }
    .rz-yield-state-card span{
      display:block;
      color:var(--rz-muted,#6b7280);
      font-size:9px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.035em;
    }
    .rz-yield-state-card strong{
      display:block;
      margin-top:5px;
      color:var(--rz-text,#111827);
      font-size:12px;
      font-weight:950;
      overflow-wrap:anywhere;
    }
    .rz-yield-msg{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(22,163,74,.08);
      border:1px solid rgba(22,163,74,.14);
      color:#15803d;
      font-size:11px;
      font-weight:800;
    }
    .rz-yield-msg.is-visible{display:block;}
    .rz-yield-msg.is-error{
      background:rgba(239,68,68,.08);
      border-color:rgba(239,68,68,.14);
      color:#b91c1c;
    }
    .rz-yield-form{margin-top:14px;}
    .rz-yield-switch-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:14px;
      border-radius:18px;
      background:rgba(248,250,252,.82);
      border:1px solid rgba(17,24,39,.06);
    }
    .rz-yield-switch-row label{
      display:block;
      color:var(--rz-text,#111827);
      font-size:13px;
      font-weight:950;
    }
    .rz-yield-switch-row p{
      margin:4px 0 0;
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:700;
      line-height:1.4;
    }
    .rz-yield-switch{position:relative;display:inline-flex!important;align-items:center;flex:0 0 auto;}
    .rz-yield-switch input{position:absolute;opacity:0;pointer-events:none;}
    .rz-yield-switch span{
      width:48px;
      height:28px;
      display:block;
      padding:3px;
      border-radius:999px;
      background:rgba(100,116,139,.28);
      transition:.18s ease;
      box-sizing:border-box;
    }
    .rz-yield-switch span::after{
      content:"";
      display:block;
      width:22px;
      height:22px;
      border-radius:999px;
      background:#fff;
      box-shadow:0 2px 8px rgba(15,23,42,.16);
      transition:.18s ease;
    }
    .rz-yield-switch input:checked + span{background:#16a34a;}
    .rz-yield-switch input:checked + span::after{transform:translateX(20px);}
    .rz-yield-switch input:disabled + span{opacity:.48;cursor:not-allowed;}
    .rz-yield-section{margin-top:14px;}
    .rz-yield-section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
      padding:0 2px;
    }
    .rz-yield-section-head strong{
      display:block;
      color:var(--rz-text,#111827);
      font-size:12px;
      font-weight:950;
    }
    .rz-yield-section-head div > span{
      display:block;
      margin-top:3px;
      color:var(--rz-muted,#6b7280);
      font-size:10px;
      font-weight:700;
      line-height:1.35;
    }
    .rz-yield-feature-badge{
      flex:0 0 auto;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(22,163,74,.09);
      border:1px solid rgba(22,163,74,.15);
      color:#15803d;
      font-size:9px;
      font-weight:950;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .rz-yield-feature-note{
      display:flex;
      flex-direction:column;
      gap:3px;
      margin-top:12px;
      padding:12px 13px;
      border-radius:16px;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.07);
      color:#475569;
      font-size:10px;
      font-weight:750;
      line-height:1.42;
    }
    .rz-yield-feature-note strong{color:#334155;font-size:11px;font-weight:950;}
    .rz-yield-feature-note.is-warning{
      background:rgba(245,158,11,.08);
      border-color:rgba(245,158,11,.16);
      color:#92400e;
    }
    .rz-yield-fields{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:10px;
    }
    .rz-yield-field{
      display:block;
      padding:12px;
      border-radius:16px;
      background:rgba(248,250,252,.72);
      border:1px solid rgba(17,24,39,.06);
    }
    .rz-yield-field > span{
      display:block;
      margin-bottom:7px;
      color:rgba(17,24,39,.78);
      font-size:11px;
      font-weight:900;
    }
    .rz-yield-field input,.rz-yield-field select{margin:0;width:100%;}
    .rz-yield-field small{
      display:block;
      margin-top:6px;
      color:var(--rz-muted,#6b7280);
      font-size:10px;
      font-weight:700;
      line-height:1.35;
    }
    .rz-yield-input-unit{position:relative;}
    .rz-yield-input-unit input{padding-right:48px;}
    .rz-yield-input-unit b{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      color:var(--rz-muted,#6b7280);
      font-size:11px;
      font-weight:900;
      pointer-events:none;
    }
    .rz-yield-readonly{
      margin-top:10px;
      padding:11px 12px;
      border-radius:14px;
      background:rgba(100,116,139,.08);
      border:1px solid rgba(100,116,139,.13);
      color:#475569;
      font-size:11px;
      font-weight:800;
      line-height:1.4;
    }
    .rz-yield-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:14px;
    }
    .rz-yield-actions .filter-btn{width:auto!important;min-width:110px;}

    @media(max-width:820px){
      .rz-du-toolbar{grid-template-columns:1fr 1fr;}
      .rz-du-refresh{grid-column:1/-1;width:100%!important;}
      .rz-du-metrics{grid-template-columns:1fr;}
      .rz-du-attribution-grid{grid-template-columns:1fr;}
      .rz-yield-state-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
      .rz-yield-fields{grid-template-columns:1fr;}
    }
    @media(max-width:640px){
      .rz-du-card{border-radius:20px;}
      .rz-du-toolbar{grid-template-columns:1fr;}
      .rz-du-refresh{grid-column:auto;}
      .rz-du-total.is-visible{display:block;}
      .rz-du-total-note{margin-top:9px;text-align:left;}
      .rz-du-pool{padding:15px;}
      .rz-du-pool-head{align-items:flex-start;}
      .rz-du-pool-actions{align-items:flex-end;}
      .rz-du-yield-btn{max-width:150px;white-space:normal;line-height:1.2;}
      .rz-du-value{font-size:38px;}
      .rz-du-day{grid-template-columns:88px 1fr auto;}
      .rz-yield-modal{align-items:flex-end;padding:0;}
      .rz-yield-sheet{width:100%;max-height:92vh;border-radius:26px 26px 0 0;}
      .rz-yield-sheet-head{padding:18px 16px 13px;}
      .rz-yield-content{padding:15px 16px 18px;}
      .rz-yield-state-grid{grid-template-columns:1fr 1fr;}
      .rz-yield-actions{display:grid;grid-template-columns:1fr 1fr;}
      .rz-yield-actions .filter-btn{width:100%!important;min-width:0;}
    }
  </style>
</head>
